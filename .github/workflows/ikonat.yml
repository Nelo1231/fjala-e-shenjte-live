name: Ikonat e ditës (automatike)

# Punon vetë në GitHub, edhe kur laptopi është i fikur.
# GitHub-i i hedh shpesh nisjet e orarit, ndaj ka dy mundësi në orë; cloud/ikonat.py e thërret Apify-n
# vetëm kur kontrolli i fundit është më i vjetër se 5 orë (dhe gjithmonë kur niset me dorë).
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ikonat
  cancel-in-progress: false

jobs:
  ikonat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalo Pillow
        run: pip install --quiet pillow

      - name: Merr ikonat e reja
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -X utf8 cloud/ikonat.py

      - name: Ruaj në GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/apostujt data/imazhet_*.json cloud/gjendja_ikonat.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Asnjë ikonë e re"; exit 0; fi
          git commit -q -m "Ikonat e ditës (automatike)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
