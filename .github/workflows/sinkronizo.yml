name: Sinkronizo Ikonat Automatikisht

on:
  schedule:
    # Ekzekutohet cdo dite ne oren 07:00 te Shqiperise (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Te lejon ta nisesh edhe manualisht per testim

permissions:
  contents: write

jobs:
  sinkronizo:
    runs-on: ubuntu-latest
    steps:
      - name: Merr kodin nga GitHub
        uses: actions/checkout@v4

      - name: Instalo Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalo librarite e nevojshme
        run: |
          pip install requests pillow

      - name: Ekzekuto skriptin e sinkronizimit
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python auto_sinkronizo.py

      - name: Ruaj dhe ngarko ndryshimet ne GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Perditesim automatik i ikonave" && git push)
