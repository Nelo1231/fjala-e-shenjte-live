<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fjala e Shenjtë</title>
  <meta name="description" content="Psaltiri, Ungjilli, Apostulli dhe thëniet e Etërve të Kishës, si reels, me muzikë bizantine.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fjala e Shenjtë">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2.5.7">
  <link rel="stylesheet" href="css/glass.css?v=2.5.7">
</head>
<body>
  <!-- Ekrani hyrës (2–3 sekonda) -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-inner">
      <svg class="splash-cross" viewBox="-14 -14 348 448"><use href="#i-cross"/></svg>
      <h1 class="splash-title">Fjala e Shenjtë</h1>
    </div>
    <p class="splash-by">Minuel Çollaku</p>
  </div>

  <div class="app" id="app" data-view="feed">
    <!-- REELS: rrjedha vertikale si Instagram Reels / TikTok -->
    <section class="feed-wrap" id="feedWrap" aria-label="Reels">
      <div class="feed" id="feed"></div>
    </section>

    <!-- Biblioteka (Lexo): lista majtas, leximi djathtas në Fold/Duo -->
    <aside class="pane pane-list" id="paneList" aria-label="Lista"></aside>
    <main class="pane pane-main" id="paneMain" tabindex="-1"></main>

    <nav class="nav" aria-label="Navigimi">
      <div class="nav-brand" aria-hidden="true"><svg viewBox="-14 -14 348 448"><use href="#i-cross"/></svg></div>
      <button class="nav-btn" data-go="kreu" aria-current="page"><svg><use href="#i-home"/></svg><span>Kreu</span></button>
      <button class="nav-btn" data-go="lexo"><svg><use href="#i-book"/></svg><span>Lexo</span></button>
      <button class="nav-btn" data-go="shpirti"><svg><use href="#i-candle"/></svg><span>Shpirti</span></button>
      <button class="nav-btn" data-go="kisha"><svg><use href="#i-church"/></svg><span>Kisha</span></button>
      <button class="nav-btn" data-go="pelqyerat"><svg><use href="#i-heart"/></svg><span>Të miat</span></button>
    </nav>
  </div>

  <!-- Disku i muzikës (luajtësi i YouTube brenda tij, gjithmonë i dukshëm) -->
  <button class="disc" id="musicDisc" aria-label="Muzika bizantine">
    <div class="disc-inner"><div id="ytPlayer"></div></div>
  </button>

  <!-- Radio Ngjallja live: prek për ta ndalur (muzika bizantine rinis vetë) -->
  <button class="radio-pill" id="radioPill" hidden aria-label="Ndal Radio Ngjallja">
    <span class="rp-dot"></span><span class="rp-name">Radio Ngjallja</span><span class="rp-state">LIVE</span><svg><use href="#i-stop"/></svg>
  </button>

  <!-- Fleta e muzikës -->
  <div class="sheet" id="musicSheet" hidden>
    <div class="sheet-card music-card" role="dialog" aria-modal="true" aria-label="Muzikë bizantine">
      <div class="music-video-slot" aria-hidden="true"></div>
      <p class="music-title" id="musicTitle">Muzikë bizantine</p>
      <p class="music-sub" id="musicSub">Po ngarkohet…</p>
      <p class="music-ctx" id="musicCtx"></p>
      <div class="music-controls">
        <button class="round-btn big" id="musicPlay" aria-label="Luaj"><svg><use href="#i-play"/></svg></button>
        <button class="round-btn" id="musicNext" aria-label="Tjetra"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Gjuha e këngës">
        <button role="radio" data-lang="mix" aria-checked="true">Mix</button>
        <button role="radio" data-lang="sq" aria-checked="false">Shqip</button>
        <button role="radio" data-lang="el" aria-checked="false">Ελληνικά</button>
        <button role="radio" data-lang="en" aria-checked="false">English</button>
      </div>
      <div class="seg music-more" role="radiogroup" aria-label="Kore të tjera">
        <button role="radio" data-lang="athos" aria-checked="false">Athos</button>
        <button role="radio" data-lang="ro" aria-checked="false">Română</button>
        <button role="radio" data-lang="ru" aria-checked="false">Русский</button>
        <button role="radio" data-lang="gr" aria-checked="false">Gregoriane</button>
      </div>
      <p class="music-src" id="musicSrc"></p>
      <button class="btn ghost wide" data-act="close">Mbyll</button>
    </div>
  </div>

  <!-- Fleta e vargut (në Lexo) -->
  <div class="sheet" id="verseSheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetRef">
      <p class="sheet-ref" id="sheetRef"></p>
      <blockquote class="sheet-text" id="sheetText"></blockquote>
      <div class="sheet-actions four">
        <button class="btn" data-act="like"><svg><use href="#i-heart"/></svg><span>Pëlqej</span></button>
        <button class="btn" data-act="share"><svg><use href="#i-send"/></svg><span>Ndaj</span></button>
        <button class="btn" data-act="note"><svg><use href="#i-pen"/></svg><span>Shënim</span></button>
        <button class="btn" data-act="copy"><svg><use href="#i-copy"/></svg><span>Kopjo</span></button>
      </div>
      <button class="btn ghost wide" data-act="close">Mbyll</button>
    </div>
  </div>

  <!-- Ndaj: Instagram, Story, Facebook, WhatsApp, Messenger, Email -->
  <div class="sheet" id="shareSheet" hidden>
    <div class="sheet-card share-card" role="dialog" aria-modal="true" aria-label="Ndaj">
      <div class="share-head">
        <div class="share-preview" id="sharePreview" aria-hidden="true"></div>
        <div class="share-info"><p class="share-text" id="shareText"></p><p class="share-ref" id="shareRef"></p></div>
      </div>
      <p class="share-label">Ndaj si foto</p>
      <div class="share-grid">
        <button data-to="instagram"><span class="tgt ig"><svg><use href="#i-instagram"/></svg></span>Instagram</button>
        <button data-to="story"><span class="tgt ig-story"><svg><use href="#i-story"/></svg></span>Story</button>
        <button data-to="facebook"><span class="tgt fb"><svg><use href="#i-facebook"/></svg></span>Facebook</button>
        <button data-to="save"><span class="tgt neutral"><svg><use href="#i-download"/></svg></span>Ruaj</button>
        <button data-to="whatsapp"><span class="tgt wa"><svg><use href="#i-wa"/></svg></span>WhatsApp</button>
        <button data-to="messenger"><span class="tgt ms"><svg><use href="#i-messenger"/></svg></span>Messenger</button>
        <button data-to="email"><span class="tgt mail"><svg><use href="#i-mail"/></svg></span>Email</button>
        <button data-to="telegram"><span class="tgt tg"><svg><use href="#i-send"/></svg></span>Telegram</button>
        <button data-to="copy"><span class="tgt neutral"><svg><use href="#i-copy"/></svg></span>Kopjo tekstin</button>
        <button data-to="more"><span class="tgt neutral"><svg><use href="#i-dots"/></svg></span>Të tjera</button>
      </div>
      <button class="btn ghost wide" data-to="close">Mbyll</button>
    </div>
  </div>

  <!-- Shënim personal -->
  <div class="sheet" id="noteSheet" hidden>
    <div class="sheet-card note-sheet" role="dialog" aria-modal="true" aria-label="Shënim">
      <p class="note-who">Shënim i <strong id="noteWho"></strong></p>
      <div class="note-passage" id="notePassage" hidden><p id="notePassageText"></p><p class="note-ref" id="notePassageRef"></p></div>
      <textarea id="noteText" rows="6" placeholder="Shkruaj mendimin, lutjen ose kujtimin tënd…"></textarea>
      <div class="row">
        <button class="btn primary grow" id="noteSave"><svg><use href="#i-pen"/></svg><span>Ruaj shënimin</span></button>
        <button class="btn" id="noteDelete" hidden><svg><use href="#i-close"/></svg><span>Fshi</span></button>
      </div>
      <button class="btn ghost wide" data-act="close">Mbyll</button>
    </div>
  </div>

  <!-- Profilet: secili person me shënimet dhe pëlqimet e veta -->
  <div class="sheet" id="profileSheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Profilet">
      <p class="sheet-ref">Kush po lexon?</p>
      <ul class="profile-list" id="profileList"></ul>
      <form class="profile-add" id="profileAdd">
        <input id="profileName" maxlength="30" placeholder="Emri i personit të ri" autocomplete="off">
        <button class="btn primary" type="submit"><svg><use href="#i-plus"/></svg><span>Shto</span></button>
      </form>
      <button class="btn ghost wide" data-act="close">Mbyll</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
